name: bench-harness

on:
  pull_request:
    paths:
      - "bench/**"
      - ".github/workflows/bench-harness.yml"
  push:
    branches: [main]
    paths:
      - "bench/**"
      - ".github/workflows/bench-harness.yml"

permissions:
  contents: read

jobs:
  hermetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Install hermetic test deps
        run: python -m pip install -r bench/constraints.txt
      - name: Hermetic harness tests
        run: python -m pytest bench/tests -q
