# bench-harness: hermetic tests for the bench/ evaluation harness.
#
# ADVISORY. Never make `hermetic` a required status check: the workflow-level
# `paths:` filter means a PR touching none of these paths gets no check run at
# all, and a required check that never reports stalls the merge queue forever.
#
# The paths are bench/ plus the files outside it that the job reads and the
# files outside it that bench tests name as ROOT / "..." paths (pyproject.toml
# is pytest's config file for the run).
# bench/tests/test_workflow.py pins this file's structure: triggers and paths,
# step order, SHA pins, the hashed install line and the verify bracketing.
name: bench-harness

on:
  pull_request:
    paths:
      - "bench/**"
      - ".github/workflows/bench-harness.yml"
      - "constraints-ci.txt"
      - "scripts/verify_ci_environment.py"
      - "BENCHMARKS.md"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "bench/**"
      - ".github/workflows/bench-harness.yml"
      - "constraints-ci.txt"
      - "scripts/verify_ci_environment.py"
      - "BENCHMARKS.md"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: bench-harness-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hermetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Install CI deps
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r constraints-ci.txt
      # bench/ is outside the repository lint legs (tests.yml, verify-local-lint-gate.sh).
      - name: Import-hygiene lint (bench)
        run: ruff check --select F401,F821 --target-version py312 bench/ bench/pact-bench
      - name: Verify the CI environment (before harness tests)
        run: python scripts/verify_ci_environment.py
      - name: Hermetic harness tests
        run: bash bench/run_hermetic.sh
      - name: Verify the CI environment (after harness tests)
        if: always()
        run: python scripts/verify_ci_environment.py
