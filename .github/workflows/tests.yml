# PACT plugin test suite — continuous integration.
#
# WHAT THIS DOES
#   Runs the pact-plugin pytest suite on every pull request and on pushes to
#   `main`. Its primary job is to auto-run the structural + meta-tests — the
#   seam-dependent-hook presence/anti-mock checks in
#   `pact-plugin/tests/test_hook_infra_classifier.py`, which key off the
#   `SEAM_DEPENDENT_HOOKS` SSOT in `hooks/shared/hook_infra_classifier.py` — on
#   every hook-infra PR, so a regression in those gates cannot merge unseen.
#   It also keeps `main` green by catching direct pushes.
#
#   This is locus-a auto-enforcement. It is NOT a runtime hook — it never loads
#   into any consumer project's session, so it carries zero consumer-pollution
#   risk and may reference concrete project specifics freely.
#
# WHY THIS INTERPRETER, AND WHAT THE DECLARED FLOOR RESTS ON
#   CI runs ONE job on Python 3.12: the tested set and the declared floor
#   coincide by design. 3.9-3.11 support was DROPPED deliberately, and the
#   3.13/3.14 cells were removed rather than silently retained — a 3.12
#   green certifies 3.12, so newer interpreters are UNVERIFIED, a known gap
#   rather than an unnoticed one. Re-widening in either direction takes the
#   measured sequence the old matrix taught: run the suite on the target
#   interpreter, classify every failure as shipped-code, test-side, or
#   dependency (those license different remedies, and only the first says
#   anything about the declared floor), repair what is test-side and
#   demonstrate the pass, and only then add the cell — a cell added before
#   the demonstrated pass is adoption on faith.
#   The declared `requires-python = ">=3.12"` floor IS test-verified: this
#   job runs the whole suite at the floor. It was measured before the
#   collapse (28736 passed, 31 skipped on 3.12.3, reconciling exactly to
#   collection), never assumed.
#   Two STATIC checks remain and still earn their place, because a run and a
#   scan fail differently: the 3.12 syntax-floor gate in tests/test_py312_syntax_floor.py
#   and the `--target-version py312` lint below. The gate's notes record
#   that `feature_version` NARROWS rather than replaces live verification —
#   the old 3.9 gate was measured false-passing PEP 701 f-strings that a
#   3.9 interpreter rejects — so the run is what backs the floor and the
#   scan is what covers the scanned roots whether or not a test executes
#   them. The scan checks syntax and annotation form only: a post-3.12 API
#   call is invisible to it, which is the ceiling the next paragraph states.
#   READ THE RUN WITH ITS BOUND: a green run certifies the suite's EXECUTED
#   paths under the COLLECTED set, not the tree. A post-3.12 API on a path
#   no test executes stays green forever. That ceiling is structural and no
#   CI run can lift it.
#   The earlier `>=3.7` declaration was REFUTED, not merely unmeasured: an
#   assignment expression in hooks/shared/session_resume.py needs 3.8.
#
# WHY `working-directory: pact-plugin`
#   `tests/conftest.py` inserts sys.path entries relative to its own location and
#   resolves the local `telegram/` package via the current working directory, so
#   the CURRENT WORKING DIRECTORY must be `pact-plugin/`. This is the idiomatic
#   encoding of the canonical `cd pact-plugin && python -m pytest` invocation.
#
#   The constraint is on the WORKING DIRECTORY, not on pytest's rootdir — the two
#   are separate concepts and it is easy to name the wrong one here. `pact-plugin/`
#   carries no pytest config, so rootdir actually resolves to the repository root.
#   That is correct and needs no change; the step still requires
#   `working-directory: pact-plugin`.
#
# DEPENDENCY SET (empirically verified — see note below)
#   The suite is stdlib + the third-party libraries listed below. Each bullet
#   states what breaks without that library. Do not drop any of them to shorten
#   the install line — the failure modes differ, and not all of them are loud.
#     - pytest           : the runner (hard import everywhere).
#     - httpx            : UNGUARDED top-level import in the local telegram
#                          package (telegram/voice.py, telegram/telegram_client.py)
#                          and in telegram test modules → without it,
#                          `python -m pytest` ERRORS at COLLECTION.
#     - pytest-asyncio   : the suite has a large `@pytest.mark.asyncio` cohort.
#                          An unhandled async test FAILS (measured on pytest
#                          8.4.2, one failure per async test). Without this
#                          plugin that whole cohort is RED.
#     - hypothesis       : property tests guard it with try/except + skipif, so
#                          it is technically optional, but it is installed so the
#                          property tests actually RUN rather than silently skip.
#     - pyyaml           : UNGUARDED top-level `import yaml` in the skill test
#                          modules under `skills/`. Without it those modules
#                          ERROR at COLLECTION and pytest aborts the run, so
#                          ZERO tests execute — not "the skill tests are
#                          skipped", the WHOLE run executes nothing.
#                          It was absent from this list historically because the
#                          set was derived by running the SCOPED `pytest tests/`,
#                          which never collected those modules and so never saw
#                          their import. It became mandatory the moment the run
#                          began collecting `skills/`, which it now does
#                          unconditionally — see "WHY THERE ARE NO PATH
#                          ARGUMENTS" at the test step below.
#     - pysqlite3 /      : the pact-memory suite. Without them the
#       sqlite-vec /       vector-migration tests FAIL (not skip) and the
#       model2vec          `TestSqliteVecIntegration` class SKIPS — ROUND 2 below
#                          names which library causes which. The memory CLI
#                          subprocess tests are NOT affected: their fixture falls
#                          back to stdlib sqlite3, so do not "fix" them here.
#                          Declared here so CI does not install
#                          them mid-run: a test-time install reaches the network
#                          and lands AFTER collection-time availability checks
#                          have skipped their tests, so the suite silently runs
#                          fewer tests than it reports. memory_init.py refuses to
#                          install when CI is set, so this list and the package
#                          list in that module must stay in step.
#   `telegram` is the LOCAL package under pact-plugin/, NOT the pip library — it
#   needs no install (it resolves via the working-directory on sys.path).
#     - ruff             : the import-hygiene lint step ONLY (not a test dep).
#                          Unpinned by design: the step's --select bounds the
#                          rule surface, so new ruff releases cannot add rule
#                          classes to it.
#
#   VERIFICATION: every entry was proven by RUNNING the suite in a clean venv,
#   never by grepping imports. This heading vouches for every entry beneath it,
#   so read both paragraphs — no reader should inherit a stronger warrant than
#   the evidence supports.
#
#   CURRENT WARRANT — the set was verified AS A WHOLE against the WIDENED
#   collection, on ONE interpreter; CI runs that one interpreter, so the
#   warrant and the CI resolved set are the same question. Two clean venvs
#   differing ONLY in the pact-memory packages: with the full set the suite is
#   green; with those packages removed the consequences are exactly these —
#     - pyyaml removed            -> collection is INTERRUPTED, ZERO tests run.
#     - pysqlite3 + sqlite-vec    -> the `TestSqliteVecIntegration` class SKIPS
#       removed                      and the `maybe_migrate_embeddings` tests
#                                    FAIL, both in
#                                    `tests/test_vector_dimension_fixes.py`.
#     - model2vec removed         -> the real-CLI probe in
#                                    `tests/test_archive_pin.py` FAILS.
#
#   WHY THE EARLIER DERIVATION CANNOT CARRY THIS HEADING ALONE. The original set
#   was derived by running the SCOPED `pytest tests/`. That path argument encoded
#   a BELIEF about where the tests live, and the belief was wrong for the modules
#   under `skills/` — so the derivation ran through an instrument narrowed by an
#   unexamined assumption, and its output looked entirely plausible either way.
#   This is a property of the METHOD, not one forgotten entry: pyyaml is the
#   symptom that absence made visible, not the scope of the problem. Treat any
#   dependency conclusion reached through a narrowed invocation as UNVERIFIED for
#   the wider one — including the entries that derivation did cover, which is why
#   the whole set was re-run above rather than only the newly added ones.
#
#   DRIFT ANCHOR (exact, so a check has two endpoints to compare): the
#   pact-memory packages in the install line above must equal the pip names in
#   the `packages` list of
#   `pact-plugin/skills/pact-memory/scripts/memory_init.py` — exactly
#   `pysqlite3`, `sqlite-vec`, `model2vec`. That module refuses to install when
#   CI is set, so if the two lists diverge nothing installs the difference and
#   CI shows the consequences listed above.
#
#   Populations are NAMED above rather than counted, and suite-wide counts are
#   deliberately absent: a name stays checkable, a number goes stale silently,
#   and a stale figure under a heading claiming "empirically verified" is worse
#   than none, because the heading vouches for it.
#   Remaining skips include intentional carve-outs (live-tmux-only probes,
#   orchestrator carve-out, pin-caps test-design, fuzz-strategy edges),
#   version-conditional cases, and baked-SHA differentials in files that still
#   read git history: such a file skips a differential when a SHA it needs is
#   unreachable from origin's refs.
#   Green-with-skips is the accepted CI outcome; skipped is not failed.

name: tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Minimal privilege: this workflow only checks out the repo and runs pytest —
# it needs read access to repo contents and nothing else. Pinning the token
# scope here drops the default broader GITHUB_TOKEN permissions.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # THE TESTED SET. IT IS NOT THE SUPPORTED FLOOR, AND THE TWO ARE
    # DIFFERENT QUESTIONS THAT LIVE IN DIFFERENT FILES.
    #   THE TESTED SET is the interpreter this job runs: 3.12, set below.
    #   THE SUPPORTED FLOOR is `requires-python` in pyproject.toml at the
    #   repository root. The two coincide today — this job runs the suite
    #   AT the floor — but they remain different questions: moving either
    #   one takes its own run on the new target, not an inference from
    #   this one.
    #
    # CHECK NAME. A scalar job reports a check called `pytest` — the
    # stable name; a matrix renames its cells (`pytest (3.9)`, ...) on
    # every change. Measured on 2026-08-10 against this repository: NO
    # required status check is configured, on classic branch protection or
    # in the one active ruleset, so a rename blocks no pull request. IF
    # SOMEBODY LATER REQUIRES A STATUS CHECK, require a stable aggregate
    # name rather than a matrix cell, because each change to a matrix
    # renames the cells.
    steps:
      # Third-party actions are pinned to a full commit SHA (supply-chain
      # hardening: a moving tag like @v5 can be repointed to malicious code).
      # The trailing comment records the human-readable tag the SHA resolves to.
      # These majors run on Node24 (checkout@v4 / setup-python@v5 were Node20,
      # deprecated by GitHub — forced off by 2026-06-16, so re-pinned forward).
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Full history, because two certification files still load a base
          # commit's merge_guard_common.py with `git show <sha>` for their
          # base-vs-HEAD differentials: test_merge_guard_1178_cert.py and
          # test_merge_guard_1136_canonical_join_ssot.py, whose bases are on
          # main. In a shallow clone (fetch-depth: 1) those commits are absent,
          # `git show` fails, and those differential rows skip. fetch-depth sets
          # DEPTH, not REFSPEC: it cannot fetch a commit no ref on origin
          # reaches, so a history-reading file also skips a differential whose
          # SHA only a deleted branch or a fork reaches. Certification files
          # whose bases are vendored under
          # pact-plugin/tests/fixtures/merge_guard_baseline/ read no history
          # and fail, never skip, when a base is missing.
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          # A literal this file declares, not event input, so it carries no
          # injection surface.
          python-version: "3.12"

      # HuggingFace model cache. THE ONE PATH THE IN-TEST REMEDIES CANNOT REACH.
      #
      # The suite's child processes now pin the model cache and refuse network
      # (see `tests/fixtures/hf_cache.py`), which stops a cold download in every
      # test that can tolerate one. `tests/test_embedding_status_contract.py`
      # CANNOT: its forced fault sits strictly downstream of the no-model return,
      # so it needs `generate_embedding` to SUCCEED and therefore the model to
      # LOAD. `HF_HUB_OFFLINE` breaks that test and an `HF_HOME` binding is a
      # no-op for it, because its children inherit this job's environment
      # already. On a genuinely cold runner that child MUST fetch: measured at
      # 85s to over 120s against its own 120s subprocess budget, which is a
      # failure rather than a slow pass. Raising the budget would convert a
      # two-minute red into a two-minute green and leave the 59M transfer in
      # place — so the remedy belongs here, in the environment, not in the test.
      #
      # PATH: `~/.cache/huggingface` — the PARENT, not `hub/`. huggingface_hub
      # derives `HF_HOME` as `${XDG_CACHE_HOME:-~/.cache}/huggingface` and
      # `HF_HUB_CACHE` as `$HF_HOME/hub`; the parent also carries `xet/`, which
      # the CAS transfer layer writes and which `hub/` alone would miss. No
      # `HF_HOME` or `XDG_CACHE_HOME` is set anywhere in this workflow, so the
      # default applies.
      #
      # KEY: hashes `embeddings.py` because `MODEL_NAME` lives there, so
      # changing the model invalidates the entry rather than silently reusing
      # the old blob. (Keys of the old matrix carried the interpreter because
      # the cells resolved different model2vec majors; the matrix is gone and
      # the token with it — the changed key shape cannot collide with an old
      # entry, which ages out by GitHub's own eviction.)
      # RESTORE-ONLY, WITH THE SAVE GATED BELOW. A plain `actions/cache` saves
      # unconditionally at post-job, and that is unsafe here for a reason we
      # measured: an INTERRUPTED transfer leaves a cache that looks warm and
      # cannot load. Two cold runs of the same test file produced 12 files with
      # a `no-model` result and 14 files with a 120s timeout — so a partial
      # model is a state this repository actually reaches, and an unconditional
      # save would store one under a key claiming completeness. Every later run
      # would then hit that cache and fail to load, while the cache step
      # reported a hit. NO RESTORE-KEYS for the same reason: a fallback entry
      # from another commit's key could be the partial one.
      - name: Restore the embedding model cache
        id: hf_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pact-plugin/skills/pact-memory/scripts/embeddings.py') }}

      - name: Install test dependencies
        # See the "DEPENDENCY SET" header note for why each lib is required.
        # pytest-asyncio is REQUIRED, not optional: the suite has a large
        # @pytest.mark.asyncio cohort, and without this plugin that whole
        # cohort is RED. Measured on pytest 8.4.2: one failure per async test,
        # `Failed: async def functions are not natively supported`. Do NOT drop
        # it to "shorten" the line — the async cohort simply stops passing, and
        # it is a large fraction of the suite.
        run: python -m pip install --upgrade pip pytest hypothesis httpx pytest-asyncio pyyaml pysqlite3 sqlite-vec model2vec ruff

      # WARM THE MODEL ONCE, HERE, WHERE NOTHING IS TIMING IT.
      #
      # This does more than populate the cache: it MOVES THE DOWNLOAD OUT OF A
      # TIMED TEST CHILD. `tests/test_embedding_status_contract.py` needs a
      # working model (its forced fault sits strictly downstream of the
      # no-model return), and its child carries a 120s subprocess budget. A
      # cold transfer measured 85s to over 120s against that budget, so the
      # test was racing the network. Fetching here removes the race regardless
      # of whether the cache hits.
      #
      # IT ALSO LOADS THE MODEL, NOT JUST FETCHES IT. A completed fetch and a
      # loadable model are different claims, and the gap between them is the
      # partial-cache state described above. `from_pretrained` failing here
      # fails the job loudly rather than leaving a broken cache for the suite
      # to trip over quietly.
      #
      # MODEL_NAME IS READ FROM THE SOURCE, never retyped: a literal here would
      # be a second copy free to drift from the one the code loads, and the
      # cache key already hashes that same file.
      - name: Warm and verify the embedding model
        working-directory: pact-plugin
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "skills/pact-memory")
          from scripts.embeddings import MODEL_NAME
          from model2vec import StaticModel
          print(f"loading {MODEL_NAME}")
          m = StaticModel.from_pretrained(MODEL_NAME, force_download=False)
          v = m.encode(["warm the cache"])
          assert v.shape[0] == 1, v.shape
          print(f"model loaded and encoded, dim={v.shape[1]}")
          PY

      # SAVE ONLY AFTER THE MODEL DEMONSTRABLY LOADED. The gate is the previous
      # step: if it failed the job stops, and `if: always()` is deliberately NOT
      # used — a cache saved from a failed warm is the exact partial-model
      # artifact this split exists to prevent. Skipped on a hit, because
      # re-saving an identical key is a no-op that only logs a warning.
      - name: Save the embedding model cache
        if: steps.hf_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.hf_cache.outputs.cache-primary-key }}

      # Import-hygiene lint, two legs. Leg 1: unused imports (F401) + undefined
      # names (F821) over all of pact-plugin/ — hooks, scripts, telegram,
      # skills, AND tests/. Leg 2: F821 only, over the same tree — F821 is the
      # class the behavioral suite structurally cannot reach (undefined names
      # in cold fail-open branches execute only when the rare condition fires).
      # Leg 2 is subsumed by leg 1 today; the redundancy is DELIBERATE
      # structure: it keeps pact-plugin/-wide F821 coverage independent of
      # leg 1's path list, so a future re-narrowing of leg 1 (e.g. a new
      # backlog-dir exclusion) cannot silently drop F821 coverage.
      # Runs before pytest so a hygiene defect fails in seconds, not after
      # the multi-minute suite.
      # --target-version py312 pins the dialect explicitly: with the flag the
      # legs are independent of any target ruff would infer from config, and
      # the flag text is what the byte-parity test compares — do not drop it.
      # Where an editing session has an LSP server, its diagnostics complement
      # this check at edit time; this step is the mechanical guarantee.
      # `ruff --version` echoes the resolved version into the log: ruff is
      # installed UNPINNED (the --select bound keeps releases from adding rule
      # classes), so this line is the only record of what a given run linted
      # with — the CI half of the version comparison a local-green/CI-red
      # divergence needs. The local mirror scripts/verify-local-lint-gate.sh
      # stamps its own version the same way, and
      # pact-plugin/tests/test_local_lint_parity.py byte-compares this step's
      # legs against that script.
      - name: Import-hygiene lint (F401/F821)
        run: |
          ruff --version
          ruff check --select F401,F821 --target-version py312 pact-plugin/
          ruff check --select F821 --target-version py312 pact-plugin/

      # The working directory must be pact-plugin/ (CWD-relative conftest
      # sys.path + local `telegram` package) — see the header note: this
      # constrains the WORKING DIRECTORY, not pytest's rootdir. Equivalent to
      # `cd pact-plugin && python -m pytest`.
      #
      # WHY THERE ARE NO PATH ARGUMENTS — deliberate, do not add any.
      #   A path argument collects ONLY what it names, so any test directory not
      #   listed is dropped silently: an edit is then certified by a gate that
      #   never ran the tests written for it. That is not hypothetical — it
      #   already happened here. Test modules living inside the skill
      #   directories they guard went uncollected under a `tests/`-only
      #   argument, and repairing it also forced pyyaml into the install line,
      #   because the scoped invocation had been blind to the `import yaml` in
      #   those modules by construction.
      #   A bare `pytest` from pact-plugin/ has no such blind spot: it collects
      #   whatever is there, so a NEW test directory is picked up automatically
      #   instead of needing someone to remember this line. The invariant is
      #   self-maintaining rather than asserted.
      #   CERTIFIED BY MUTATION, not by a green suite: a throwaway test
      #   directory outside tests/ and skills/ IS collected with no path
      #   arguments, and is NOT collected once they are named. Re-run that
      #   mutation before trusting any change to this step.
      #   Two ways to silently re-narrow it, both closed on purpose: do not add
      #   path arguments back "for speed" (they collect the same set today, so
      #   the only behaviour an explicit list can add is dropping something
      #   later), and do not add a `testpaths` entry to config — with no path
      #   arguments it would now TAKE EFFECT and re-introduce the same gap
      #   through a different door.
      #   `-ra` is a REPORTING flag, not a collection-scope change: it adds a
      #   short-summary section listing every non-passing outcome, and selects
      #   nothing. It is here so skip REASONS are readable from this log —
      #   which is what settles any census of what the remaining skips
      #   actually are.
      #   NEVER `-rs`. `-r` REPLACES the short-summary selection rather than
      #   adding to it, so `-rs` deletes the FAILED lines: measured here on a
      #   run carrying one real failure, where a `^FAILED` scan returned 0 AND
      #   the anchored `^[0-9]+ passed` scan also returned 0, because a failing
      #   summary leads with its failures. Two misleading zeros on one red run.
      #   `-ra` is everything except passes, so failures and errors stay.
      - name: Run test suite
        working-directory: pact-plugin
        run: python -m pytest -ra
